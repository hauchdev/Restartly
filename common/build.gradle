plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version

    if (file("src/main/resources/META-INF/accesstransformer.cfg").exists()) {
        accessTransformers = [
                "src/main/resources/META-INF/accesstransformer.cfg"
        ]
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation 'org.yaml:snakeyaml:2.6'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The legacyForge dev environment adds Minecraft to the main compile
    // classpath as a file collection; mirror it for the test source set.
    testImplementation files(sourceSets.main.compileClasspath.files)
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events "failed", "skipped"
        showStandardStreams = false
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }

    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}