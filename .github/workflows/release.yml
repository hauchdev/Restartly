name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Tag to publish (e.g. v1.1.0). The workflow is normally triggered
          automatically by pushing the tag; manual dispatch is only a fallback
          for re-running a failed publish, so the tag must exist already.
        required: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.version.outputs.tag }}
      changelog-found: ${{ steps.changelog.outputs.found }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve version to publish
        id: version
        run: |
          # Prefer the explicit tag input for manual runs, otherwise the
          # triggering tag (e.g. v1.1.0). The leading 'v' is stripped.
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG_VERSION="${{ github.event.inputs.tag }}"
          else
            TAG_VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${TAG_VERSION#v}" >> "${GITHUB_OUTPUT}"
          # Store the tag for the publish step (manual runs provide it as an
          # input; tag runs take it from the push event).
          echo "tag=${TAG_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Check the tag exists
        # Manual runs must point at a real tag; softprops fails otherwise.
        run: |
          git fetch --depth=1 origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Check version matches gradle.properties
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PROP_VERSION="$(sed -n 's/^version=\(.*\)$/\1/p' gradle.properties)"
          echo "Publishing version: ${VERSION}"
          echo "gradle.properties version: ${PROP_VERSION}"
          if [ "${VERSION}" != "${PROP_VERSION}" ]; then
            echo "::error::Release version does not match gradle.properties. Run './scripts/release.sh ${VERSION}', merge the PR, then tag."
            exit 1
          fi

      - name: Extract changelog notes
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Grab everything between the "## [<version>] ..." heading and the
          # next "## [" heading (the header line itself is not included).
          # Literal brackets are written as [ and ] character classes to stay
          # independent of awk's backslash escaping.
          awk -v v="${VERSION}" '
            $0 ~ "^## [[]" v "[]]" { capture = 1; next }
            capture && $0 ~ "^## [[]" { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
            echo "Found changelog notes for ${VERSION}."
          else
            echo "found=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::No '## [${VERSION}]' section in CHANGELOG.md; falling back to auto-generated release notes."
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v5
        with:
          name: release-notes
          path: release-notes.md

  publish:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 60
    steps:
      - name: Check out the tagged commit
        # Build exactly what was tagged so the release always matches the tag.
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.release-tag }}

      - name: Set up build environment
        uses: ./.github/actions/setup-build

      - name: Build release jars
        run: sh gradlew :common:build :fabric:build :forge:build --no-daemon

      - name: Download release notes
        uses: actions/download-artifact@v5
        with:
          name: release-notes
          path: release-notes

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The workflow normally runs from a tag push; manual runs provide
          # the tag through the workflow_dispatch input.
          tag_name: ${{ needs.validate.outputs.release-tag }}
          body_path: release-notes/release-notes.md
          # When no CHANGELOG entry matched the version, fall back to
          # GitHub's auto-generated (PR-based) release notes.
          generate_release_notes: ${{ needs.validate.outputs.changelog-found == 'false' }}
          fail_on_unmatched_files: true
          files: |
            fabric/build/libs/restartly-fabric-*.jar
            forge/build/libs/restartly-forge-*-all.jar
